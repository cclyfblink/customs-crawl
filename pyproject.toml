[project]
name = "customs-crawl"
version = "0.1.0"
description = "Standalone China Customs statistics crawler coordinator"
requires-python = ">=3.11,<3.15"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
customs-crawl = "customs_crawl.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/customs_crawl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
